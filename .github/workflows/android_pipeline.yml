name: Pipeline CI/CD - Master Inventory Equipo 8

# ─── Disparador ───────────────────────────────────────────────────────────────
# Se activa con cada push o pull request a la rama master
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Compilar el proyecto (Etapas 1, 2 y 3)
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: "Etapa 1-2-3: Checkout → Entorno → Compilar"
    runs-on: ubuntu-latest

    steps:

      # ── Etapa 1: Obtener código fuente ──────────────────────────────────────
      - name: "Etapa 1 - Obtener código fuente"
        uses: actions/checkout@v4

      # ── Etapa 2: Configurar entorno ─────────────────────────────────────────
      - name: "Etapa 2 - Instalar JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Etapa 2 - Activar caché de Gradle"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: "Etapa 2 - Inyectar google-services.json desde secreto"
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: "Etapa 2 - Dar permisos de ejecución a gradlew"
        run: chmod +x gradlew

      # ── Etapa 3: Compilar proyecto ──────────────────────────────────────────
      - name: "Etapa 3 - Compilar proyecto (assembleDebug)"
        run: ./gradlew assembleDebug --no-daemon

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 y 3: Pruebas Unitarias + Lint (Etapas 4 y 5 en PARALELO)
  # Ambos jobs dependen de que "build" haya pasado
  # ════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "Etapa 4 - Pruebas Unitarias (InventoryViewModelTest)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Caché Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inyectar google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: "Etapa 4 - Ejecutar 6 pruebas unitarias (JUnit + Mockito)"
        run: ./gradlew test --no-daemon

      - name: "Guardar reporte de pruebas como artefacto"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    name: "Etapa 5 - Análisis Lint del código Kotlin"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Caché Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inyectar google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: "Etapa 5 - Ejecutar análisis Lint"
        run: ./gradlew lintDebug --no-daemon

      - name: "Guardar reporte Lint HTML como artefacto"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: Generar APK Release (Etapa 6)
  # Solo se ejecuta si las Etapas 4 Y 5 pasaron exitosamente
  # ════════════════════════════════════════════════════════════════════════════
  release-apk:
    name: "Etapa 6 - Generar APK Release"
    runs-on: ubuntu-latest
    needs: [ unit-tests, lint ]

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Caché Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inyectar google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: "Etapa 6 - Compilar APK Release"
        run: ./gradlew assembleRelease --no-daemon

      - name: "Guardar APK Release como artefacto descargable"
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release-MasterInventory
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
